<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpheroNav Sovereign - Ultimate Live Test Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow-x: hidden;
            margin: 0;
        }
        #universeCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            pointer-events: none;
        }
        .glass-panel {
            background: rgba(12, 12, 18, 0.92);
            backdrop-filter: blur(40px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 30px 60px rgba(0,0,0,0.95);
        }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 4px; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between relative custom-scrollbar pb-24">

    <!-- 3D Universe Galaxy Background -->
    <canvas id="universeCanvas"></canvas>

    <!-- Header -->
    <header class="flex justify-between items-center px-6 py-4 relative z-20">
        <div class="flex items-center space-x-3">
            <div class="glass-panel px-4 py-2 rounded-full flex items-center space-x-2 text-xs font-bold cursor-pointer hover:bg-zinc-800 transition">
                <div class="w-5 h-5 rounded-full bg-purple-600 flex items-center justify-center text-[10px] text-white">S</div>
                <span id="workspaceTitle">Hamim's SpheroNav Sovereign</span>
                <span class="text-[10px] text-gray-400">ˆ</span>
            </div>
        </div>
        <div class="flex items-center space-x-3">
            <div class="w-9 h-9 rounded-full bg-orange-600 flex items-center justify-center font-bold text-sm text-white shadow-lg relative cursor-pointer" onclick="openProfileVault()">
                H
                <div class="absolute -top-0.5 -right-0.5 w-3 h-3 bg-red-500 rounded-full border-2 border-black"></div>
            </div>
        </div>
    </header>

    <!-- Main Screens Container -->
    <main class="flex-1 flex flex-col items-center justify-center px-4 relative z-20 my-auto w-full">
        
        <!-- SCREEN 1: HOME (Dashboard & Prompt Studio) -->
        <div id="screenHome" class="w-full flex flex-col items-center justify-center">
            <div class="inline-flex items-center space-x-2 px-4 py-1.5 rounded-full bg-white/5 border border-white/10 mb-6 backdrop-blur-md">
                <span class="text-blue-400 font-bold">✦</span>
                <span class="text-emerald-400 font-bold">⚛</span>
                <span class="text-xs text-gray-300 font-medium">Live Test Sandbox & Autonomous AI Active →</span>
            </div>

            <h1 class="text-3xl sm:text-5xl font-semibold tracking-tight mb-8 text-center">What's the vision, Hamim?</h1>

            <!-- Prompt Box Card -->
            <div class="w-full max-w-xl glass-panel rounded-3xl p-5 shadow-2xl relative">
                <textarea id="promptInput" rows="2" class="w-full bg-transparent text-sm sm:text-base text-white placeholder-zinc-500 focus:outline-none resize-none custom-scrollbar" placeholder="Ask AI to build a game or app to test..."></textarea>
                
                <!-- Quick Idea Chips -->
                <div class="flex flex-wrap gap-2 my-2 py-1 border-t border-white/5">
                    <button onclick="setIdea('♟️ দাবা গেম তৈরি করে টেস্ট করো')" class="px-2.5 py-1 rounded-lg bg-white/5 hover:bg-white/10 text-[11px] text-gray-300 transition">♟️ Test Chess Game</button>
                    <button onclick="setIdea('🎲 লুডু গেম তৈরি করে টেস্ট করো')" class="px-2.5 py-1 rounded-lg bg-white/5 hover:bg-white/10 text-[11px] text-gray-300 transition">🎲 Test Ludo Game</button>
                    <button onclick="setIdea('🏪 সুপারশপ অ্যাপ তৈরি করে টেস্ট করো')" class="px-2.5 py-1 rounded-lg bg-white/5 hover:bg-white/10 text-[11px] text-gray-300 transition">🏪 Test Superstore</button>
                </div>

                <div class="flex justify-between items-center pt-2 border-t border-white/10 mt-1">
                    <div class="flex items-center space-x-2">
                        <button onclick="insertAsset()" class="w-8 h-8 rounded-full hover:bg-white/10 flex items-center justify-center text-gray-400 hover:text-white transition text-lg">+</button>
                    </div>

                    <div class="flex items-center space-x-3">
                        <!-- Build Dropdown Menu -->
                        <div class="relative">
                            <button onclick="toggleBuildMenu(event)" class="px-3 py-1.5 rounded-xl hover:bg-white/10 text-xs font-semibold text-gray-200 flex items-center space-x-1.5 transition">
                                <span id="currentModeLabel">Build</span>
                                <span id="arrowIcon" class="text-[10px] transition-transform">˅</span>
                            </button>

                            <div id="buildMenuPopup" class="hidden absolute right-0 bottom-full mb-2 w-64 bg-[#18181b] border border-white/15 rounded-2xl p-2 shadow-2xl z-50 text-xs space-y-1">
                                <div onclick="selectEngineMode('Build')" class="p-3 rounded-xl hover:bg-white/10 cursor-pointer transition">
                                    <div class="font-semibold text-white flex justify-between items-center">
                                        <span>Build</span>
                                        <span id="checkBuild" class="text-sky-400 font-bold">✓</span>
                                    </div>
                                    <div class="text-[11px] text-zinc-400 mt-0.5">Make changes directly</div>
                                </div>
                                <div onclick="selectEngineMode('Chat')" class="p-3 rounded-xl hover:bg-white/10 cursor-pointer transition">
                                    <div class="font-semibold text-white flex justify-between items-center">
                                        <span>Chat</span>
                                        <span id="checkChat" class="hidden text-sky-400 font-bold">✓</span>
                                        <span class="bg-blue-600 text-white font-semibold px-2 py-0
