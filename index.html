<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpheroNav Sovereign Engine - Quantum Speed</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow-x: hidden;
            margin: 0;
            will-change: transform;
        }
        #universeCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            pointer-events: none;
        }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 4px; }
        .ultra-fast-panel {
            background: rgba(18, 18, 24, 0.85);
            backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between relative custom-scrollbar">

    <!-- 3D Ultra-Speed Quantum Galaxy Canvas -->
    <canvas id="universeCanvas"></canvas>

    <!-- Header (Workspace & Profile) -->
    <header class="flex justify-between items-center px-6 py-4 relative z-20">
        <div class="flex items-center space-x-3">
            <div class="bg-zinc-900/80 border border-white/10 px-3.5 py-1.5 rounded-full flex items-center space-x-2 text-xs font-bold cursor-pointer hover:bg-zinc-800 transition backdrop-blur-md">
                <div class="w-5 h-5 rounded-full bg-purple-600 flex items-center justify-center text-[10px] text-white">S</div>
                <span>SpheroNav Sovereign Engine</span>
                <span class="text-[10px] font-mono text-emerald-400">⚡ 0.001ms</span>
            </div>
        </div>
        <div class="flex items-center space-x-3">
            <div class="w-9 h-9 rounded-full bg-orange-600 flex items-center justify-center font-bold text-sm text-white shadow-lg relative cursor-pointer">
                H
                <div class="absolute -top-0.5 -right-0.5 w-3 h-3 bg-emerald-500 rounded-full border-2 border-black"></div>
            </div>
        </div>
    </header>

    <!-- Main Workspace Area -->
    <main class="flex-1 flex flex-col items-center justify-center px-4 relative z-20 my-auto">
        
        <div class="inline-flex items-center space-x-2 px-4 py-1.5 rounded-full bg-white/5 border border-white/10 mb-6 backdrop-blur-md">
            <span class="text-blue-400 font-bold">✦</span>
            <span class="text-emerald-400 font-bold">⚛</span>
            <span class="text-xs text-gray-300 font-medium">Ultra-Fast Quantum AI Core Active →</span>
        </div>

        <h1 class="text-3xl sm:text-5xl font-semibold tracking-tight mb-8 text-center">What's the vision, Hamim?</h1>

        <!-- Prompt Box Card -->
        <div class="w-full max-w-xl ultra-fast-panel rounded-3xl p-5 shadow-2xl relative">
            <textarea id="promptInput" rows="2" class="w-full bg-transparent text-sm sm:text-base text-white placeholder-zinc-500 focus:outline-none resize-none custom-scrollbar" placeholder="Create an enterprise app or game..."></textarea>
            
            <div class="flex justify-between items-center pt-3 border-t border-white/10 mt-2">
                <div class="flex items-center space-x-2">
                    <button onclick="insertAsset()" class="w-8 h-8 rounded-full hover:bg-white/10 flex items-center justify-center text-gray-400 hover:text-white transition text-lg">+</button>
                </div>

                <div class="flex items-center space-x-3">
                    <!-- Build Dropdown Trigger -->
                    <div class="relative">
                        <button onclick="toggleBuildMenu(event)" class="px-3 py-1.5 rounded-xl hover:bg-white/10 text-xs font-semibold text-gray-200 flex items-center space-x-1.5 transition">
                            <span id="currentModeLabel">Build</span>
                            <span id="arrowIcon" class="text-[10px] transition-transform">˅</span>
                        </button>

                        <!-- Popup Menu (Build, Chat, Plan) -->
                        <div id="buildMenuPopup" class="hidden absolute right-0 bottom-full mb-2 w-64 bg-[#18181b] border border-white/15 rounded-2xl p-2 shadow-2xl z-50 text-xs space-y-1">
                            
                            <div onclick="selectEngineMode('Build', 'Direct execution mode')" class="p-3 rounded-xl hover:bg-white/10 cursor-pointer transition">
                                <div class="font-semibold text-white flex justify-between items-center">
                                    <span>Build</span>
                                    <span id="checkBuild" class="text-sky-400 font-bold">✓</span>
                                </div>
                                <div class="text-[11px] text-zinc-400 mt-0.5">Make changes directly</div>
                            </div>

                            <div onclick="selectEngineMode('Chat', 'Free AI reasoning')" class="p-3 rounded-xl hover:bg-white/10 cursor-pointer transition">
                                <div class="font-semibold text-white flex justify-between items-center">
                                    <span>Chat</span>
                                    <span id="checkChat" class="hidden text-sky-400 font-bold">✓</span>
                                    <span class="bg-blue-600 text-white font-semibold px-2 py-0.5 rounded-full text-[10px]">Free</span>
                                </div>
                                <div class="text-[11px] text-zinc-400 mt-0.5">Ask anything, explore ideas</div>
                            </div>

                            <div onclick="selectEngineMode('Plan', 'High spec architecture')" class="p-3 rounded-xl hover:bg-white/10 cursor-pointer transition">
                                <div class="font-semibold text-white flex justify-between items-center">
                                    <span>Plan</span>
                                    <span id="checkPlan" class="hidden text-sky-400 font-bold">✓</span>
                                </div>
                                <div class="text-[11px] text-zinc-400 mt-0.5">Detailed spec for complex builds</div>
                            </div>

                        </div>
                    </div>

                    <button onclick="triggerVoiceInput()" class="w-8 h-8 rounded-full hover:bg-white/10 flex items-center justify-center text-gray-400 hover:text-white transition text-base">🎙️</button>
                    
                    <!-- Instant Execute Arrow Button -->
                    <button onclick="executeEngineAction()" class="w-9 h-9 rounded-full bg-gradient-to-r from-purple-600 to-pink-600 hover:scale-105 flex items-center justify-center text-white font-bold transition shadow-lg" title="Run Super-Fast Execution">
                        ➔
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- Output Sandbox Modal -->
    <div id="executionModal" class="fixed inset-0 bg-black/95 backdrop-blur-2xl z-50 hidden flex flex-col p-4 sm:p-8">
        <div class="flex justify-between items-center pb-4 border-b border-white/10">
            <div>
                <h3 id="executionTitle" class="text-base font-bold text-white">SpheroNav Core Output</h3>
                <p id="executionSubtitle" class="text-xs text-gray-400 font-mono">Status: Super-Fast Compiled</p>
            </div>
            <button onclick="closeExecutionModal()" class="px-4 py-2 bg-white/10 hover:bg-white/20 rounded-xl text-xs font-bold text-white transition">✕ Close Sandbox</button>
        </div>

        <div class="flex-1 bg-zinc-950 border border-white/10 rounded-3xl mt-4 p-6 overflow-y-auto flex flex-col items-center justify-center relative shadow-inner" id="outputContentArea">
        </div>
    </div>

    <!-- Floating Navigation Bar -->
    <nav class="relative z-20 mx-auto mb-6 bg-zinc-900/80 border border-white/10 px-5 py-2.5 rounded-full flex items-center space-x-6 backdrop-blur-xl shadow-2xl">
        <button class="p-2.5 rounded-full bg-white/15 text-white text-lg">🏠</button>
        <button class="p-2.5 rounded-full hover:bg-white/10 text-gray-400 text-lg transition">㗊</button>
        <button class="p-2.5 rounded-full hover:bg-white/10 text-gray-400 text-lg transition">💬</button>
    </nav>

    <script>
        // Highly Optimized GPU-Accelerated Galaxy Canvas
        const canvas = document.getElementById('universeCanvas');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
        const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: false, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        const particleCount = 3500;
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);

        for(let i = 0; i < particleCount * 3; i += 3) {
            positions[i] = (Math.random() - 0.5) * 1800;
            positions[i+1] = (Math.random() - 0.5) * 1800;
            positions[i+2] = (Math.random() - 0.5) * 1800;
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        const material = new THREE.PointsMaterial({ size: 2, color: 0x9333ea, transparent: true, opacity: 0.7 });
        const galaxy = new THREE.Points(geometry, material);
        scene.add(galaxy);
        camera.position.z = 800;

        function animate() {
            requestAnimationFrame(animate);
            galaxy.rotation.y += 0.0005;
            renderer.render(scene, camera);
        }
        animate();

        let currentActiveMode = "Build";
        let currentModeDescription = "Make changes directly";

        function toggleBuildMenu(event) {
            event.stopPropagation();
            document.getElementById('buildMenuPopup').classList.toggle('hidden');
        }

        function selectEngineMode(modeName, modeDesc) {
            currentActiveMode = modeName;
            currentModeDescription = modeDesc;
            document.getElementById('currentModeLabel').innerText = modeName;
            document.getElementById('checkBuild').classList.toggle('hidden', modeName !== 'Build');
            document.getElementById('checkChat').classList.toggle('hidden', modeName !== 'Chat');
            document.getElementById('checkPlan').classList.toggle('hidden', modeName !== 'Plan');
            document.getElementById('buildMenuPopup').classList.add('hidden');
        }

        function insertAsset() {
            document.getElementById('promptInput').value = "Create a high-speed trading system";
        }

        function triggerVoiceInput() {
            document.getElementById('promptInput').value = "Build a fast social network dashboard";
        }

        // Instant Super-Fast Execution Logic
        function executeEngineAction() {
            const promptText = document.getElementById('promptInput').value.trim();
            if(!promptText) {
                alert("দয়া করে প্রম্পট বক্সে কিছু লিখুন!");
                return;
            }

            const modal = document.getElementById('executionModal');
            const outputArea = document.getElementById('outputContentArea');

            modal.classList.remove('hidden');
            outputArea.innerHTML = `
                <div class="w-full max-w-lg bg-zinc-900 border border-purple-500/40 rounded-3xl p-6 text-left space-y-4 shadow-2xl">
                    <div class="flex justify-between items-center border-b border-white/10 pb-3">
                        <span class="text-xs font-bold text-purple-400 uppercase">⚡ Quantum Execution Output</span>
                        <span class="text-[10px] bg-emerald-500/20 text-emerald-400 px-2 py-0.5 rounded font-bold">0.001ms Latency</span>
                    </div>
                    <h3 class="text-base font-bold text-white">${promptText}</h3>
                    <p class="text-xs text-gray-400">SpheroNav Sovereign Engine super-fast latency-তে প্রজেক্ট জেনারেট করেছে।</p>
                    <div class="bg-black p-4 rounded-xl border border-white/10 font-mono text-xs text-emerald-400">
                        [SPEED_STATUS]: Instant compilation complete.<br>
                        [ENGINE]: High-throughput microservice node linked.<br>
                        [PERFORMANCE]: 100% Zero-lag responsive.
                    </div>
                    <button onclick="alert('সোর্স কোড ও প্যাকেজ ইনস্ট্যান্ট ডাউনলোড হয়েছে!')" class="w-full py-3 bg-gradient-to-r from-purple-600 to-pink-600 text-white font-bold rounded-xl text-xs hover:opacity-90 transition">Download Source Code & APK 📦</button>
                </div>
            `;
        }

        function closeExecutionModal() {
            document.getElementById('executionModal').classList.add('hidden');
        }

        document.addEventListener('click', function(e) {
            const popup = document.getElementById('buildMenuPopup');
            if(popup && !popup.contains(e.target)) {
                popup.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
