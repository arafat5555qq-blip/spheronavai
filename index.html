<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spheronav Sovereign 11D Omniverse</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #030305;
            color: #00F0FF;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(0, 240, 255, 0.2);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 0 50px rgba(0, 240, 255, 0.1);
            max-width: 600px;
            width: 90%;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 20px;
            color: #FFD700;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        p {
            font-size: 16px;
            color: #ffffff;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .btn {
            background: linear-gradient(135deg, #00F0FF, #FFD700);
            color: #030305;
            padding: 12px 30px;
            border: none;
            border-radius: 30px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }
        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px #00F0FF;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Spheronav 11D Omniverse</h1>
        <p>সিস্টেম সফলভাবে ইনিশিয়ালাইজ হয়েছে। কোয়ান্টাম নিউরাল ইঞ্জিন এবং থ্রিডি ভিজ্যুয়াল ম্যাট্রিক্স অ্যাক্টিভ রয়েছে।</p>
        <a href="#" class="btn" onclick="alert('সিস্টেম ফুললি ফাংশনাল!')">সিস্টেম অ্যাক্টিভেট করুন</a>
    </div>
</body>
</html>
